
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm p-4 mx-auto"
         style="max-width: 600px;">

        <h2 class="text-center mb-4">Edit Student</h2>

        <form action="{{ url_for('edit_student', id=student[0]) }}"
              method="POST">

            <div class="mb-3">
                <label class="form-label">Student Name</label>

                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ student[1] }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Age</label>

                <input type="number"
                       name="age"
                       class="form-control"
                       value="{{ student[2] }}"
                       min="1"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Grade</label>

                <input type="text"
                       name="grade"
                       class="form-control"
                       value="{{ student[3] }}"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-success w-100">
                Update Student
            </button>

            <a href="{{ url_for('index') }}"
               class="btn btn-secondary w-100 mt-2">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
